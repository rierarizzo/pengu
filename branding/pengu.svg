<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Pengu</title>
  <desc id="d">A play button with a beak's two mandibles.</desc>
  <defs>
    <path id="beak" d="M335 300 L702 512 L335 724 Z" stroke-width="64" stroke-linejoin="round"/>
    <mask id="beakMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <path d="M335 300 L702 512 L335 724 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="64" stroke-linejoin="round"/>
    </mask>
    <clipPath id="upper"><polygon points="0,0 1024,0 1024,426 0,699"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#0B0B0B"/>

  <!-- The mark at 72 % of the canvas: 1.513 scales the original geometry,
       which sat at 48 %, and translate(502) re-centres it on x. -->
  <g transform="translate(502 512) scale(1.513) translate(-512 -512)">
    <!-- Lower mandible -->
    <use href="#beak" fill="#D98A0B" stroke="#D98A0B"/>
    <!-- Upper mandible -->
    <use href="#beak" fill="#F5B02A" stroke="#F5B02A" clip-path="url(#upper)"/>
    <!-- Split between the mandibles -->
    <line x1="0" y1="699" x2="1024" y2="426" stroke="#0B0B0B" stroke-width="8" mask="url(#beakMask)"/>
  </g>
</svg>
