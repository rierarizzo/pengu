<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Pengu</title>
  <desc id="d">A play button with a beak's two mandibles.</desc>
  <defs>
    <path id="beak" d="M338.5 428.4 L698.5 332 L602.1 692 Z" stroke-width="128" stroke-linejoin="round"/>
    <!-- The mandible seam, stepped instead of blended: three flat bands of the
         same orange whose cuts are parallel to the seam (0,699)-(1024,426),
         because the gradient axis is perpendicular to it and centred on it. The
         band above .33 clamps to the seam colour, so only the two cuts need a
         stop pair. -->
    <linearGradient id="plumage" gradientUnits="userSpaceOnUse"
                    x1="473.23" y1="404.81" x2="760.03" y2="570.86">
      <stop offset="0.33" stop-color="#F5B02A"/>
      <stop offset="0.33" stop-color="#E79D1B"/>
      <stop offset="0.67" stop-color="#E79D1B"/>
      <stop offset="0.67" stop-color="#D98A0B"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#0B0B0B"/>

  <!-- The mark at 72 % of the canvas: 1.513 scales the original geometry,
       which sat at 48 %, and translate(502) re-centres it on x. The stroke is what
       rounds the tips (radius 64, twice the hand-off's 32), and the triangle is
       scaled 0.849 so the outer hull still measures 488 units tall — the tips would
       otherwise retract and the mark would read smaller. -->
  <g transform="translate(502 512) scale(1.513) translate(-512 -512)">
    <use href="#beak" fill="url(#plumage)" stroke="url(#plumage)"/>
  </g>
</svg>
